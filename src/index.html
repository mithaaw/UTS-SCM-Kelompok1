<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catatan Harian</title>

  <!-- Bootswatch Flatly - clean & easy going blue theme -->
  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/flatly/bootstrap.min.css" rel="stylesheet" />

  <style>
    body {
      background-color: #f4f6f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar-brand {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .navbar-tagline {
      font-size: 13px;
      opacity: 0.75;
    }

    .main-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 16px;
    }

    .welcome-card {
      text-align: center;
      max-width: 400px;
    }

    .welcome-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    footer {
      padding: 16px;
      text-align: center;
      font-size: 12px;
      color: #95a5a6;
      border-top: 1px solid #e0e0e0;
      background-color: #fff;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark bg-primary px-4">
    <div class="container-fluid">
      <span class="navbar-brand">Catatan Harian</span>
    </div>
  </nav>

  <div class="main-content">
    <div class="welcome-card">
      <div class="welcome-icon">📝</div>
      <h4 class="text-primary fw-semibold">Selamat Datang!</h4>
      <p class="text-muted">Aplikasi Catatan Harian Kelompok 1.</p>
    </div>
  </div>

  <footer>&copy; 2026 Catatan Harian</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
